<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Family Finance</title>

    <!-- Makes "Add to Home Screen" launch full-screen like an app instead of
         a plain browser tab, and gives iOS a themed status bar instead of
         falling back to a screenshot of whatever page was open. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Family Finance" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style id="expo-reset">
      html, body {
        height: 100%;
        background-color: #0b1220;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Shown the instant the HTML loads, before the JS bundle has even
         finished downloading -- without this the screen is just blank
         until React mounts, which reads as "stuck" rather than "loading",
         especially on the slower first load after adding to the home
         screen. React overwrites #root's contents on mount, so this needs
         no JS of its own to be cleared away. */
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background-color: #0b1220;
      }
      #initial-loader .spinner {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid #1d3a6e;
        border-top-color: #3b82f6;
        animation: initial-loader-spin 0.8s linear infinite;
      }
      #initial-loader .label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        color: #94a3b8;
        letter-spacing: 0.3px;
      }
      @keyframes initial-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="label">Loading Family Finance…</div>
      </div>
    </div>
  </body>
</html>
